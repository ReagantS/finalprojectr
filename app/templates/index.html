<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Inventaris</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📦 Sistem Manajemen Inventaris</h1>
                <p>Kelola inventaris dengan mudah dan efisien</p>
            </div>
        </header>

        <!-- Summary Section -->
        <section class="summary-section">
            <div class="summary-card">
                <div class="summary-icon">📊</div>
                <div class="summary-info">
                    <h3>Total Item</h3>
                    <p id="totalItems" class="summary-value">0</p>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">💰</div>
                <div class="summary-info">
                    <h3>Nilai Total</h3>
                    <p id="totalValue" class="summary-value">Rp 0</p>
                </div>
            </div>
        </section>

        <!-- Add Item Form -->
        <section class="form-section">
            <div class="form-card">
                <h2>Tambah Item Baru</h2>
                <form id="addItemForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemName">Nama Item *</label>
                            <input type="text" id="itemName" placeholder="Masukkan nama item" required>
                        </div>
                        <div class="form-group">
                            <label for="itemCategory">Kategori *</label>
                            <input type="text" id="itemCategory" placeholder="Misal: Elektronik" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemLocation">Lokasi *</label>
                            <input type="text" id="itemLocation" placeholder="Misal: Gudang A" required>
                        </div>
                        <div class="form-group">
                            <label for="itemQuantity">Jumlah *</label>
                            <input type="number" id="itemQuantity" placeholder="0" min="0" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemPrice">Harga Satuan (Rp) *</label>
                            <input type="number" id="itemPrice" placeholder="0" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="itemDescription">Deskripsi</label>
                            <input type="text" id="itemDescription" placeholder="Deskripsi singkat (opsional)">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Tambah Item</button>
                </form>
            </div>
        </section>

        <!-- Search and Filter Section -->
        <section class="search-section">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari item berdasarkan nama atau kategori...">
            <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
        </section>

        <!-- Inventory Table Section -->
        <section class="table-section">
            <div class="table-card">
                <h2>Daftar Inventaris</h2>
                <div class="table-responsive">
                    <table id="itemsTable" class="items-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Item</th>
                                <th>Kategori</th>
                                <th>Lokasi</th>
                                <th>Jumlah</th>
                                <th>Harga (Rp)</th>
                                <th>Total Nilai (Rp)</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="itemsTableBody">
                            <tr class="empty-state">
                                <td colspan="8" style="text-align: center; padding: 40px;">
                                    📭 Belum ada item. Tambahkan item baru terlebih dahulu.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal Edit Item -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Item</h2>
            <form id="editItemForm">
                <input type="hidden" id="editItemId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="editItemName">Nama Item *</label>
                        <input type="text" id="editItemName" required>
                    </div>
                    <div class="form-group">
                        <label for="editItemCategory">Kategori *</label>
                        <input type="text" id="editItemCategory" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editItemLocation">Lokasi *</label>
                        <input type="text" id="editItemLocation" required>
                    </div>
                    <div class="form-group">
                        <label for="editItemQuantity">Jumlah *</label>
                        <input type="number" id="editItemQuantity" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editItemPrice">Harga Satuan (Rp) *</label>
                        <input type="number" id="editItemPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="editItemDescription">Deskripsi</label>
                        <input type="text" id="editItemDescription">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alert Toast -->
    <div id="alertToast" class="alert-toast"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
