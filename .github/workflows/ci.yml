name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask SQLAlchemy PyMySQL pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run pytest with verbose output
        run: |
          python -m pytest tests/ -v --tb=short
      
      - name: Run tests with coverage report
        run: |
          python -m pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v
        continue-on-error: false
      
      - name: Check if coverage.xml exists
        run: |
          if [ -f coverage.xml ]; then echo "✅ coverage.xml exists"; else echo "❌ coverage.xml not found"; ls -la; fi
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
